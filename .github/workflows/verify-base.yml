name: verify-base
on:
  push:
    branches: ["tmp/verify-base"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
      - run: npm ci
      - run: npm run make-i18n
      - run: npx vitest run __tests__/components/settings/llm-profiles/add-models-modal.test.tsx || true